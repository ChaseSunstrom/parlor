# Parlor and everything around it, in one file:
#   1. cp .env.example .env, and set DATA (your media folder) in it; MOVIES, SHOWS, MUSIC, BOOKS, GAMES, YOUTUBE
#      and DOWNLOADS can each point somewhere else (another disk, an existing library). Apps always see /data/<kind>.
#   2. docker compose up -d --build
#   3. open http://<server>:8800 and create your account. Parlor then sets up every app for you:
#      no logins at home, no API keys to copy, indexers added, Jellyfin and Seerr ready.
#      Upload your VPN's WireGuard file in Settings → Services → VPN; until then nothing downloads.
# Each app keeps its config in ./<app>/config, like a hand-made *arr compose, so an existing
# one can be dropped in. Settings → Services shows what was set up and runs it again.
name: parlor

x-app: &app
  restart: unless-stopped
  environment: &env
    PUID: ${PUID:-1000}
    PGID: ${PGID:-1000}
    TZ: ${TZ:-Etc/UTC}

services:
  parlor:
    build: .
    image: parlor:latest
    networks: [default, games]   # games: the streaming bridge's own network (Games → Play from your PC)
    init: true                 # passes stop signals on while the start-up yt-dlp update runs
    depends_on:
      setup:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      <<: *env
      STACK: "1"               # the apps below run beside Parlor: it sets them up
      DATA_DIR: /config        # Parlor's own data: accounts, subscriptions, settings (encrypted)
      KEY_DIR: /key            # the key that opens it, kept apart: back up ./parlor/key
      MUSIC_DIR: /data/music
      VIDEO_DIR: /data/youtube
      SEERR_URL: http://seerr:5055
      JELLYFIN_URL: http://jellyfin:8096
      GAMES_STREAM_URL: ${GAMES_STREAM:+http://moonlight-web:8080}   # Games → Play from your PC, when it's on
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}   # your reverse proxy's address, so limits count each person (docs/security.md)
      LAN_SUBNET: ${LAN_SUBNET:-192.168.0.0/16}   # TV sets: your home network, never Docker's own (docs/tv.md)
    ports:
      - "${PORT:-8800}:8800"
    volumes:
      - ./parlor/config:/config
      - ./parlor/key:/key
      - ${DATA:-/data}:/data
      # a kind set in .env is mounted over /data/<kind>; unset, its line repeats the /data mount above and
      # Compose (2.24.3 or newer) drops it, so everything stays one mount: imports are instant and hardlinked
      - ${MOVIES:-${DATA:-/data}}:/data${MOVIES:+/movies}
      - ${SHOWS:-${DATA:-/data}}:/data${SHOWS:+/shows}
      - ${MUSIC:-${DATA:-/data}}:/data${MUSIC:+/music}
      - ${BOOKS:-${DATA:-/data}}:/data${BOOKS:+/books}
      - ${GAMES:-${DATA:-/data}}:/data${GAMES:+/games}
      - ${YOUTUBE:-${DATA:-/data}}:/data${YOUTUBE:+/youtube}
      - ${DOWNLOADS:-${DATA:-/data}}:/data${DOWNLOADS:+/downloads}   # music Parlor gets from YouTube waits here for Lidarr
      # the apps' config folders, read-only: Parlor reads their API keys from them
      - ./sonarr/config:/stack/sonarr:ro
      - ./radarr/config:/stack/radarr:ro
      - ./lidarr/config:/stack/lidarr:ro
      - ./prowlarr/config:/stack/prowlarr:ro
      - ./bazarr/config:/stack/bazarr:ro
      - ./seerr/config:/stack/seerr:ro
      - ./gluetun:/stack/gluetun       # the VPN file you upload goes here
      - ./checkrr/config:/stack/checkrr   # Parlor writes Checkrr's config (the library folders and the *arrs' keys)
      - ./questarr/config:/stack/questarr:ro   # the key Questarr shows with its game lookups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8800/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    restart: unless-stopped

  setup:                       # runs once first: makes the config folders, lets qBittorrent skip its login at home
    build: .                   # the same image as Parlor (never pulled: there's no parlor image on Docker Hub)
    image: parlor:latest
    working_dir: /app
    command: ["python", "stack.py", "init"]
    environment:
      <<: *env
      LAN_SUBNET: ${LAN_SUBNET:-192.168.0.0/16}
    volumes:
      - .:/compose
      - ${MOVIES:-${DATA:-/data}}:/data${MOVIES:+/movies}        # the media folders, so a missing one can be handed to PUID:PGID
      - ${SHOWS:-${DATA:-/data}}:/data${SHOWS:+/shows}
      - ${MUSIC:-${DATA:-/data}}:/data${MUSIC:+/music}
      - ${BOOKS:-${DATA:-/data}}:/data${BOOKS:+/books}
      - ${GAMES:-${DATA:-/data}}:/data${GAMES:+/games}
      - ${YOUTUBE:-${DATA:-/data}}:/data${YOUTUBE:+/youtube}
      - ${DOWNLOADS:-${DATA:-/data}}:/data${DOWNLOADS:+/downloads}
    restart: "no"

  gluetun:                     # the VPN; qBittorrent's only way out. Upload your WireGuard file in Parlor
                               # (Settings → Services → VPN): until then nothing gets out at all
    image: qmcgaw/gluetun:latest
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    depends_on:
      setup:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/gluetun/front-door.sh"]   # Parlor's front door: blocks, waits for the file, runs Gluetun
    environment:
      TZ: ${TZ:-Etc/UTC}
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      FIREWALL_OUTBOUND_SUBNETS: ${LAN_SUBNET:-192.168.0.0/16},172.16.0.0/12   # home network and the other containers
    volumes:
      - ./gluetun:/gluetun
    ports:
      - "8080:8080"            # qBittorrent's page
    healthcheck:               # healthy once its firewall is up (tunnel or not): only then may qBittorrent start
      test: ["CMD-SHELL", "grep -qv '^broken' /gluetun/vpn.state"]
      interval: 10s
      timeout: 5s
      start_period: 10s
    restart: unless-stopped

  qbittorrent:
    <<: *app
    image: lscr.io/linuxserver/qbittorrent:latest
    network_mode: service:gluetun   # other apps reach it at gluetun:8080
    depends_on:
      gluetun:
        condition: service_healthy   # firewall up; no VPN file yet means no internet, not no qBittorrent
      setup:
        condition: service_completed_successfully
    environment:
      <<: *env
      WEBUI_PORT: 8080
    volumes:
      - ./qbittorrent/config:/config
      - ${DATA:-/data}:/data
      - ${DOWNLOADS:-${DATA:-/data}}:/data${DOWNLOADS:+/downloads}

  prowlarr:
    <<: *app
    image: lscr.io/linuxserver/prowlarr:latest
    ports: ["9696:9696"]
    volumes:
      - ./prowlarr/config:/config

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    environment:
      LOG_LEVEL: info
      TZ: ${TZ:-Etc/UTC}
    ports: ["8191:8191"]
    restart: unless-stopped

  sonarr:
    <<: *app
    image: lscr.io/linuxserver/sonarr:latest
    ports: ["8989:8989"]
    volumes:
      - ./sonarr/config:/config
      - ${DATA:-/data}:/data
      - ${SHOWS:-${DATA:-/data}}:/data${SHOWS:+/shows}
      - ${DOWNLOADS:-${DATA:-/data}}:/data${DOWNLOADS:+/downloads}

  radarr:
    <<: *app
    image: lscr.io/linuxserver/radarr:latest
    ports: ["7878:7878"]
    volumes:
      - ./radarr/config:/config
      - ${DATA:-/data}:/data
      - ${MOVIES:-${DATA:-/data}}:/data${MOVIES:+/movies}
      - ${DOWNLOADS:-${DATA:-/data}}:/data${DOWNLOADS:+/downloads}

  lidarr:
    <<: *app
    image: lscr.io/linuxserver/lidarr:latest
    ports: ["8686:8686"]
    volumes:
      - ./lidarr/config:/config
      - ${DATA:-/data}:/data
      - ${MUSIC:-${DATA:-/data}}:/data${MUSIC:+/music}
      - ${DOWNLOADS:-${DATA:-/data}}:/data${DOWNLOADS:+/downloads}

  bazarr:
    <<: *app
    image: lscr.io/linuxserver/bazarr:latest
    ports: ["6767:6767"]
    volumes:
      - ./bazarr/config:/config
      - ${DATA:-/data}:/data
      - ${MOVIES:-${DATA:-/data}}:/data${MOVIES:+/movies}
      - ${SHOWS:-${DATA:-/data}}:/data${SHOWS:+/shows}

  jellyfin:
    <<: *app
    image: lscr.io/linuxserver/jellyfin:latest
    ports: ["8096:8096"]
    volumes:
      - ./jellyfin/config:/config
      - ${DATA:-/data}:/data
      - ${MOVIES:-${DATA:-/data}}:/data${MOVIES:+/movies}
      - ${SHOWS:-${DATA:-/data}}:/data${SHOWS:+/shows}
      - ${MUSIC:-${DATA:-/data}}:/data${MUSIC:+/music}
      - ${YOUTUBE:-${DATA:-/data}}:/data${YOUTUBE:+/youtube}
      - ${BOOKS:-${DATA:-/data}}:/data${BOOKS:+/books}
    # for hardware transcoding, pass your GPU through, e.g. devices: ["/dev/dri:/dev/dri"]

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-Etc/UTC}
      LOG_LEVEL: info
    ports: ["5055:5055"]
    volumes:
      - ./seerr/config:/app/config
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  cleanuparr:
    <<: *app
    image: ghcr.io/cleanuparr/cleanuparr:latest
    ports: ["11011:11011"]
    volumes:
      - ./cleanuparr/config:/config

  questarr:                    # games: Prowlarr's indexers, qBittorrent behind the VPN, the GAMES folder (docs/games.md)
    <<: *app
    image: ghcr.io/doezer/questarr:v1.6.0@sha256:495a1648f1ad8dddd4c7f96b4bf817d9d061bfd5608ef520522f0d891415e972   # pinned: a young project; read its notes before moving on
    depends_on:
      setup:
        condition: service_completed_successfully   # its folder must be the apps' user's before it starts
    environment:
      <<: *env
      # games are looked up by title with no IGDB keys of yours: Parlor answers from Steam's store (docs/games.md)
      IGDB_CLIENT_ID: parlor
      IGDB_CLIENT_SECRET: parlor
      NODE_OPTIONS: --require /app/data/parlor-lookup.cjs   # setup puts it there, with the key Questarr shows Parlor
    ports: ["5000:5000"]
    volumes:
      - ./questarr/config:/app/data
      - ${DATA:-/data}:/data
      - ${GAMES:-${DATA:-/data}}:/data${GAMES:+/games}
      - ${DOWNLOADS:-${DATA:-/data}}:/data${DOWNLOADS:+/downloads}

  checkrr:                     # finds films, episodes and songs that won't play; their *arr fetches new copies (docs/stack.md)
    image: aetaric/checkrr:3.6.1@sha256:c817e081e9397c240e5b13b09363fe26c9f94248489d3b4f0279e67495b1f12e
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      setup:
        condition: service_completed_successfully   # setup writes the config it starts on
    environment:
      TZ: ${TZ:-Etc/UTC}
    # Checkrr reads its config only at start: this stops it when Parlor (or you) change the file, and Docker starts it
    # again; docker compose stop reaches Checkrr at once (the trap)
    entrypoint:
      - /bin/sh
      - -c
      - 'was=$$(md5sum /config/checkrr.yaml); /checkrr -c /config/checkrr.yaml & pid=$$!; (while [ "$$was" = "$$(md5sum /config/checkrr.yaml)" ]; do sleep 10; done; kill $$pid) & trap "kill $$pid" TERM INT; wait $$pid; wait $$pid'
    ports: ["8585:8585"]
    volumes:
      - ./checkrr/config:/config
      # read-only: Checkrr only looks; a broken file is deleted by the *arr that owns it
      - ${DATA:-/data}:/data:ro
      - ${MOVIES:-${DATA:-/data}}:/data${MOVIES:+/movies}:ro
      - ${SHOWS:-${DATA:-/data}}:/data${SHOWS:+/shows}:ro
      - ${MUSIC:-${DATA:-/data}}:/data${MUSIC:+/music}:ro
    restart: unless-stopped

  moonlight-web:               # Games → Play from your PC, optional: COMPOSE_PROFILES=games-stream in .env (docs/games.md)
    image: mrcreativ3001/moonlight-web-stream:v3.0.1   # pinned: it trusts the X-Parlor-User header; check its notes before moving on
    profiles: [games-stream]
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      FORWARDED_HEADER: X-Parlor-User      # Parlor says who's asking, so the bridge's own login never shows
      PATH_PREFIX: /games/stream           # served by Parlor at /games/stream/, behind its sign-in
      WEBRTC_PORT_RANGE: "40000:40100"
      WEBRTC_NAT_1TO1_HOST: ${GAMES_STREAM_HOST:-}   # this server's address on your network, for the picture
    ports:
      - "40000-40100:40000-40100/udp"      # the picture and sound go straight to the browser; the web port stays private
    volumes:
      - ./moonlight-web/config:/moonlight-web/server   # its paired PCs
    networks: [games]                      # only Parlor can reach it, so only Parlor says who's asking
    restart: unless-stopped

networks:
  games: {}                                # Parlor and the streaming bridge, nobody else
