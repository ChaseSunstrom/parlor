<title id="t">Parlor and the apps behind it</title><desc id="d">Browser or phone → app.py (HTTPS); TV → app.py (/tv); app.py → Library; app.py → Requests; app.py → Watch and Live; app.py → Games; Library → Jellyfin (plays); Requests → Seerr (asks); Seerr → Sonarr, Radarr, Lidarr; Sonarr, Radarr, Lidarr → Prowlarr + FlareSolverr; Sonarr, Radarr, Lidarr → qBittorrent; Sonarr, Radarr, Lidarr → Bazarr; Cleanuparr → qBittorrent; qBittorrent → Gluetun; qBittorrent → Media folders (saves); Games → moonlight-web; app.py → YouTube, Twitch, Steam (fetches)</desc>
