<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#1c1a24">
<title>Parlor</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="app.css">
</head>
<body data-section="home">
<header class="bar">
  <a class="brand" href="#/"><img src="logo.svg" alt=""><span>Parlor</span></a>
  <button class="back-btn" id="back" hidden aria-label="Back"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Back</span></button>
  <nav class="nav" aria-label="Sections"></nav>
  <form class="search" id="searchForm" role="search">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <label class="vh" for="q">Search</label>
    <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search videos, movies, shows and music">
  </form>
  <button class="queue-btn" id="openQueue" aria-controls="queue" aria-expanded="false" aria-label="Downloads">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19.5h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="label">Downloads</span><span class="eq" id="eq" hidden><i></i><i></i><i></i></span><span class="count" id="count" hidden></span>
  </button>
  <button class="avatar-btn" id="account" aria-haspopup="menu" aria-expanded="false" aria-label="Account">?</button>
</header>
<div class="menu" id="accountMenu" role="menu" hidden></div>
<nav class="side" id="side" aria-label="Sections"></nav>

<main id="main"><div id="pages" hidden></div><div id="view"></div></main>

<dialog class="sheet" id="setAsk" aria-label="Request a whole set"></dialog>
<aside class="queue" id="queue" aria-label="Downloads" inert>
  <div class="queue-head">
    <h2>Downloads</h2>
    <button class="ghost" id="retryFailed" hidden>Retry failed</button>
    <button class="ghost" id="clearDone">Clear finished</button>
    <button class="icon-btn" id="closeQueue" aria-label="Close downloads">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="jobs-scroll">
    <a class="ghost torrents-link" id="torrentsLink" href="#/torrents" hidden>Torrents in qBittorrent</a>
    <h3 id="arrHead" hidden>Films, shows and albums</h3><ul class="jobs" id="arrJobs" hidden></ul>
    <h3 id="setHead" hidden>Whole sets requested</h3><ul class="jobs" id="setJobs" hidden></ul>
    <h3>Videos</h3><ul class="jobs" id="videoJobs"></ul>
    <h3>Music</h3><ul class="jobs" id="jobs"></ul>
  </div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"><span></span><button hidden>View</button></div>
<div id="gate"></div>

<script src="js/core.js"></script>
<script src="js/nav.js"></script>
<script src="js/player.js"></script>
<script src="js/music.js"></script>
<script src="js/watch.js"></script>
<script src="js/live.js"></script>
<script src="js/media.js"></script>
<script src="js/ask.js"></script>
<script src="js/library.js"></script>
<script src="js/drawer.js"></script>
<script src="js/sets.js"></script>
<script src="js/torrents.js"></script>
<script src="js/pwa.js"></script>
<script src="js/offline.js"></script>
<script src="js/tv.js"></script>
<script src="js/tvhome.js"></script>
<script src="js/remote.js"></script>
<script src="js/games.js"></script>
<script src="js/home.js"></script>
</body>
</html>
